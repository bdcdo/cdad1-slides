<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slides de CDAD-1</title>
<link rel="icon" href="data:,">
<style>
:root {
  --fundo: #ffffff; --texto: #1a1a1a; --apoio: #555555; --linha: #d6d6d6; --link: #0b57a4;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root { --fundo: #161616; --texto: #ececec; --apoio: #b0b0b0; --linha: #3a3a3a; --link: #8cc4ff; }
}
body { margin: 0; background: var(--fundo); color: var(--texto); font: 17px/1.5 system-ui, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 32px 16px 48px; }
h1 { font-size: 1.6rem; margin: 0 0 4px; }
.sub { color: var(--apoio); margin: 0 0 28px; }
ol { list-style: none; padding: 0; margin: 0; }
li.aula { border-top: 1px solid var(--linha); padding: 14px 0; }
.cabeca { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.numero { font-weight: 700; min-width: 4.5em; }
.data { color: var(--apoio); font-size: .9rem; }
.titulo { flex: 1 1 18em; }
.decks { padding: 4px 0 0 calc(4.5em + 12px); margin: 0; }
a { color: var(--link); }
a:focus-visible { outline: 3px solid var(--link); outline-offset: 2px; }
.pdf { color: var(--apoio); font-size: .9rem; margin-left: 8px; }
.vazio { color: var(--apoio); }
@media (max-width: 520px) { .decks { padding-left: 0; } }
</style>
</head>
<body>
<main>
  <h1>Ciência de Dados Aplicada ao Direito I</h1>
  <p class="sub">Slides das aulas já dadas. Cada aula abre no navegador, com as animações no lugar; o PDF continua disponível para baixar.</p>
  <ol id="aulas"><li class="vazio">Carregando…</li></ol>
</main>
<script>
"use strict";
// A lista vem de aulas.json, que o script de publicação atualiza a cada deck novo.
const escapar = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
fetch("aulas.json").then((r) => r.json()).then((aulas) => {
  const lista = document.getElementById("aulas");
  if (!aulas.length) { lista.innerHTML = '<li class="vazio">Nenhum deck publicado ainda.</li>'; return; }
  lista.innerHTML = aulas.map((a) => `<li class="aula">
    <div class="cabeca"><span class="numero">Aula ${escapar(a.aula)}</span><span class="titulo">${escapar(a.titulo)}</span><span class="data">${escapar(a.data)}</span></div>
    <p class="decks"><a href="ver.html?deck=${encodeURIComponent(a.arquivo)}&moldura=cheia">Ver os slides</a><a class="pdf" href="${escapar(a.arquivo)}" download>PDF</a></p>
  </li>`).join("");
}).catch(() => { document.getElementById("aulas").innerHTML = '<li class="vazio">Não consegui carregar a lista de aulas.</li>'; });
</script>
</body>
</html>
