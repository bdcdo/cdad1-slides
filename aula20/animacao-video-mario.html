<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O Mario em outros jogos</title>
<!--
Trecho de 0:17 a 2:08 do vídeo "Añadiendo Mario 64 a CUALQUIER juego", do canal Guinxu (YouTube,
11/04/2024, vídeo tM3vBemhy8g), dentro do deck. O nome começa com `animacao-` porque é por ele que o
visualizador do site troca a página do PDF por esta (ver `ver.html`), e o publicador de slides copia
o `mario-outros-jogos.mp4` ao lado desta página porque o `src` abaixo o cita.

Até 27/10/2026 o trecho era embutido pelo player do YouTube num iframe. Dentro do visualizador, o
Brave não tocava esse iframe pelo comando de teclado: o pedido de tocar nasce de uma tecla na página
de cima, e o navegador bloqueia a reprodução automática num quadro de outro domínio. O Bruno decidiu
nessa data trocar o embed por um clipe local, no molde do vídeo do robô da aula 19. O clipe é o
trecho cortado com ffmpeg e convertido para H.264 e AAC em 720p, que o Chrome e o Brave tocam sem
decodificador de hardware; o `+faststart` põe o índice no começo do arquivo, e o vídeo começa a
tocar antes de terminar de baixar.

Na página do deck o quadro não recebe clique (o visualizador o desenha com pointer-events: none):
o comando vem pela tecla, que o visualizador repassa por postMessage. Espaço toca e pausa, R volta
ao começo. As setas continuam mudando de página, porque esta página não informa passos ao
visualizador. Pelo mesmo motivo o modo `?embutido=cheio` não muda nada aqui: a página não tem barra
de controles própria para esconder. Aberta sozinha no navegador, ela aceita também clique e os
controles do vídeo.
-->
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: system-ui, sans-serif; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  /* O vídeo é paisagem: ocupa a largura e a altura que sobram da linha de crédito, sem cortar a
     imagem (object-fit: contain deixa faixa preta no lado que sobrar). */
  video { width: 100vw; height: calc(100vh - 2.6em); object-fit: contain; display: block; background: #000; }
  p { margin: 0.5em 0 0; color: #c8c8c8; font-size: clamp(14px, 1.4vw, 20px); }
</style>
</head>
<body>
<main>
  <video id="video" src="mario-outros-jogos.mp4" preload="auto" playsinline
    aria-label="Añadiendo Mario 64 a CUALQUIER juego, Guinxu, de 0:17 a 2:08"></video>
  <p>Guinxu, "Añadiendo Mario 64 a CUALQUIER juego", YouTube, 2024, de 0:17 a 2:08. Espaço toca e pausa; R volta ao começo.</p>
</main>
<script>
const video = document.getElementById("video");
// Dentro do deck, o quadro não recebe clique, e a barra de controles só ocuparia espaço. Aberta
// sozinha, a página mostra os controles.
if (parent === window) video.controls = true;
// Tocar com som exige um gesto da pessoa nesta página; quando o pedido vem do visualizador, o
// navegador pode recusar o som. Aí o vídeo toca sem som, em vez de não tocar.
function alternar() {
  if (!video.paused) { video.pause(); return; }
  video.muted = false;
  video.play().catch(() => { video.muted = true; video.play(); });
}
function comando(tecla) {
  if (tecla === " ") alternar();
  else if (tecla === "r" || tecla === "R") { video.currentTime = 0; }
}
addEventListener("message", (e) => { if (e.data?.tipo === "tecla") comando(e.data.key); });
addEventListener("keydown", (e) => {
  if (e.target === video) return;  // os controles do próprio vídeo já tratam a tecla
  if (e.key === " " || e.key === "r" || e.key === "R") { e.preventDefault(); comando(e.key); }
});
</script>
</body>
</html>
